name: Reusable Security Scan

on:
  workflow_call:
    inputs:
      run_full_pipeline:
        description: Execute complete local security pipeline
        type: boolean
        required: false
        default: false

permissions:
  contents: read

jobs:
  security:
    name: Security Checks
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install security test dependencies
        run: python -m pip install pre-commit==4.3.0

      - name: Validate pre-commit configuration
        run: pre-commit validate-config

      - name: Run application and policy security checks
        run: make check

      - name: Test fail-closed evidence validation
        run: make evidence-test

      - name: Test image identity validation
        run: |
          python3 -m unittest discover \
            -s tests/integration \
            -p 'test_audit_evidence.py' \
            -v

      - name: Run complete security pipeline
        if: ${{ inputs.run_full_pipeline }}
        run: make security-pipeline

      - name: Upload security evidence
        if: ${{ always() && inputs.run_full_pipeline }}
        uses: actions/upload-artifact@v4
        with:
          name: security-evidence-${{ github.run_id }}
          path: |
            reports/pipeline/run-*/
            reports/zap/
          if-no-files-found: warn
          retention-days: 7
